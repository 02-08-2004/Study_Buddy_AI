version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studybuddy_db
    environment:
      POSTGRES_USER: studybuddy
      POSTGRES_PASSWORD: studybuddy_pass
      POSTGRES_DB: studybuddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend-spring
    container_name: studybuddy_api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/studybuddy
      SPRING_DATASOURCE_USERNAME: studybuddy
      SPRING_DATASOURCE_PASSWORD: studybuddy_pass
      SERVER_PORT: 3001
      APP_FRONTEND_URL: http://localhost:5173
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: studybuddy_web
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
