# Server Configuration
server.port=3001

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/studybuddy
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Application Security & JWT
app.jwt.secret=${APP_JWT_SECRET:studybuddy_secret_key_123_very_long_secure_key_for_hmac_sha256}
app.jwt.expiration-days=7
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# Google OAuth2 Credentials — set via environment variables
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}
google.callback.url=${GOOGLE_CALLBACK_URL:http://localhost:3001/auth/google/callback}

# AI Service Configuration
ai.provider=${AI_PROVIDER:gemini}
ai.gemini.api-key=${GEMINI_API_KEY}
ai.openai.api-key=${OPENAI_API_KEY}
ai.openai.model=${OPENAI_MODEL:gpt-4o}
